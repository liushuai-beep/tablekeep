name: Publish macOS preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching package.json
        required: true
        default: v0.2.0
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - run: node tests/packaged-smoke.cjs
      - name: Publish tested app and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TAG" == "v$(node -p "require('./package.json').version")" ]]
          mkdir -p dist
          APP_ZIP="TableKeep-${TAG}-macOS-arm64.zip"
          SUMS="TableKeep-${TAG}-SHA256SUMS.txt"
          ditto -c -k --sequesterRsrc --keepParent ../TableKeep-build/TableKeep-darwin-arm64/TableKeep.app "dist/$APP_ZIP"
          (cd dist && shasum -a 256 "$APP_ZIP" > "$SUMS")
          gh release view "$TAG" > /dev/null || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "TableKeep $TAG · Menu bar preview" --notes "See README for features, installation, and preview limitations."
          gh release upload "$TAG" "dist/$APP_ZIP" "dist/$SUMS" --clobber
          gh release edit "$TAG" --draft=false --latest --target "$GITHUB_SHA"
