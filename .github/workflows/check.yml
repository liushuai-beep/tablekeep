name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - run: node tests/packaged-smoke.cjs
      - name: Archive app with macOS file modes and symlinks
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent ../TableKeep-build/TableKeep-darwin-arm64/TableKeep.app dist/TableKeep-macOS-arm64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: TableKeep-macOS-arm64
          path: dist/TableKeep-macOS-arm64.zip
